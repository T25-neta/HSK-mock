function vl(){$('#v').innerHTML=`<div class="card"><b>🎧 โหมดฟัง (ไม่ต้องมองหน้าจอ)</b><p class="mu">อ่านคำจีน → ความหมายไทย → ประโยคตัวอย่าง วนไปเรื่อยๆ เหมาะตอนเดิน กินข้าว หรือฟังเพลงคลอ เปิดเสียงมือถือไว้ (บางเครื่องจะหยุดเมื่อล็อกหน้าจอ)</p><div class="row"><span>ความเร็ว</span><select id="lr"><option value="0.7">ช้า</option><option value="0.9" selected>ปกติ</option><option value="1.1">เร็ว</option></select><select id="ls"><option value="d">คำวันนี้</option><option value="a">ทั้งระดับ</option><option value="k">เฉพาะคำที่จำแล้ว (ทบทวน)</option></select></div><br><button class="on" onclick="startL()">▶ เริ่มฟัง</button> <button onclick="stopL();vl()">⏹ หยุด</button></div><div class="card" id="ln" style="text-align:center;min-height:150px"></div>`}
async function startL(){
 stopL();const me={};LP=me;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 const rate=+$('#lr').value,m=$('#ls').value;
 let a=m=='d'?(S.daily?S.daily.ids.map(i=>W[i]):[]):m=='k'?pool().filter(w=>S.known[w.i]):pool();
 if(!a.length)a=pool();a=shuf(a).slice(0,60);
 for(const w of a){if(LP!==me)return;
  $('#ln').innerHTML=`<div class="big">${w.h}</div><div class="py">${w.p}</div><div>${chip(w)}</div><div>${w.m||''}</div>${w.ex?'<div class="ex">'+w.ex+'</div>':''}`;
  await sp(w.h,'zh-CN',rate);if(LP!==me)return;await wait(1200);
  await sp(w.m||'','th-TH',1);if(LP!==me)return;
  if(w.ex){await wait(500);await sp(w.ex,'zh-CN',rate)}
  await wait(1500)}
 if(LP===me)$('#ln').innerHTML='จบรอบแล้ว 🎉'}
/* ---- scores ---- */
const PASS={1:120,2:120,3:180,4:180,5:180,6:180};
function vs(){
 const L=S.sc||(S.sc=[]);
 $('#v').innerHTML=`<div class="card"><b>🏆 บันทึกคะแนน HSK / HSKK</b><div class="row" style="margin:8px 0"><select id="sk"><option value="HSK">HSK</option><option value="HSKK">HSKK</option></select><select id="sl">${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select><select id="sh"><option value="1">HSKK ระดับต้น</option><option value="2">HSKK ระดับกลาง</option><option value="3">HSKK ระดับสูง</option></select><input id="sd" type="date" value="${T()}"></div><div class="row"><input id="s1" type="number" placeholder="ฟัง /100" style="width:96px"><input id="s2" type="number" placeholder="อ่าน /100" style="width:96px"><input id="s3" type="number" placeholder="เขียน /100 (HSK3+)" style="width:130px"><input id="s4" type="number" placeholder="พูด /100 (HSKK)" style="width:120px"></div><br><button class="on" onclick="addSc()">บันทึก</button></div>`+anaSc(L)+
 (L.length?`<div class="card"><table>${L.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.k}${x.k=='HSK'?x.l:x.h}</td><td>${x.k=='HSK'?`ฟัง ${x.a} อ่าน ${x.b}${x.l>2?' เขียน '+x.c:''}`:'พูด '+x.e}</td></tr>`).join('')}</table></div>`:'')}
function addSc(){const g=i=>+$('#'+i).value||0,k=$('#sk').value;S.sc.push({k,l:+$('#sl').value,h:+$('#sh').value,d:$('#sd').value,a:g('s1'),b:g('s2'),c:g('s3'),e:g('s4')});save();vs()}
function anaSc(L){
 const h=L.filter(x=>x.k=='HSK').pop(),k=L.filter(x=>x.k=='HSKK').pop(),t=[];
 if(!h&&!k)return'<div class="card mu">ใส่คะแนนครั้งล่าสุดเพื่อให้ระบบวิเคราะห์และจัดแผนให้</div>';
 let o='<div class="card"><b>วิเคราะห์ผล</b><ul>';
 if(h){const sk=[['ฟัง',h.a],['อ่าน',h.b]];if(h.l>2)sk.push(['เขียน',h.c]);const tot=sk.reduce((a,x)=>a+x[1],0),ps=PASS[h.l],w=sk.slice().sort((x,y)=>x[1]-y[1])[0];
  o+=`<li>HSK ${h.l}: รวม ${tot}/${sk.length*100} (เกณฑ์ผ่าน ${ps}) — ${tot>=ps?'ผ่านแล้ว ✅ เหลืออีก '+(sk.length*100-tot)+' คะแนนถึงเต็ม':'ขาดอีก '+(ps-tot)+' คะแนน'}</li><li>ด้านที่อ่อนสุด: <b>${w[0]}</b> (${w[1]}/100) → เพิ่มเวลาฝึกด้านนี้เป็น 40% ของแต่ละวัน</li>`;
  if(h.a<h.b-15)o+='<li>ฟังต่ำกว่าอ่านมาก → ใช้โหมดฟังทุกวัน และฝึกจับพินอิน/วรรณยุกต์</li>';
  if(h.l>2&&h.c<60)o+='<li>เขียนยังต่ำ → คัดศัพท์เก่า 5 คำ/วัน และฝึกเรียงประโยค</li>';
  o+=`<li>แผนศัพท์: ทุกวันทบทวนคำเก่า (HSK 1–${h.l}) 50% คู่กับคำใหม่ 50% ${tot>=ps?`แล้วขยับไป HSK ${Math.min(6,h.l+1)}`:'ก่อนสอบซ้ำใน HSK '+h.l}</li>`;}
 if(k){o+=`<li>HSKK ${['ต้น','กลาง','สูง'][k.h-1]}: พูด ${k.e}/100 (เกณฑ์ผ่าน 60) — ${k.e>=60?'ผ่านแล้ว ✅':'ขาดอีก '+(60-k.e)+' คะแนน → ฝึกอ่านออกเสียงคำและประโยคตัวอย่างวันละ 10 นาที'}</li>`}
 return o+'</ul></div>'}

/* ---- pinyin + HSK writing ---- */
const TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
const cln=s=>s.normalize('NFC').toLowerCase().replace(/[\s'’\-·]/g,'');
const sp0=s=>cln(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function n2m(s){return s.toLowerCase().replace(/u:|v/g,'ü').replace(/([a-zü]+)([1-5])/g,(m,y,t)=>{t=+t;if(t==5)return y;let k=y.search(/[ae]/);if(k<0&&y.includes('ou'))k=y.indexOf('o');if(k<0)for(let i=y.length-1;i>=0;i--)if('iouü'.includes(y[i])){k=i;break}return k<0?y:y.slice(0,k)+TM[y[k]][t-1]+y.slice(k+1)})}
const pyok=(inp,p,len)=>len?sp0(inp.replace(/[1-5]/g,'').replace(/v|u:/g,'u'))===sp0(p):cln(n2m(inp))===cln(p);
function rec(w,ok,t){const s=st(w);S.stat[w.i]=[s[0]+ok,s[1]+!ok];const y=S.ty[t]||[0,0];S.ty[t]=[y[0]+ok,y[1]+1];save()}
const HS=new Set(W.map(w=>w.h));
function seg(s){const o=[];let i=0;while(i<s.length){let j=Math.min(4,s.length-i);for(;j>1;j--)if(HS.has(s.substr(i,j)))break;o.push(s.substr(i,j));i+=j}return o}
let WR={m:'py',w:null,L:false},WS=null;
function vwr(){$('#v').innerHTML=`<div class="row"><button class="${WR.m=='py'?'on':''}" onclick="WR.m='py';WR.w=null;vwr()">ใส่พินอิน</button><button class="${WR.m=='so'?'on':''}" onclick="WR.m='so';WS=null;vwr()">เรียงประโยค</button></div><div id="wb"></div>`;WR.m=='py'?wpy():wso()}
function wpy(){
 const p=pool().filter(w=>w.h.length<=4);if(!WR.w||WR.w.l>S.lv)WR.w=p[Math.floor(Math.random()*p.length)];const w=WR.w;
 $('#wb').innerHTML=`<div class="card" style="text-align:center"><div class="big">${w.h}</div><div class="mu">${w.m||''}</div><div style="margin:10px 0"><input id="pi" placeholder="พินอิน เช่น ni3hao3 หรือ nǐhǎo" autocapitalize="none" autocomplete="off" style="width:100%;max-width:320px" onkeydown="if(event.key=='Enter')wchk()"></div><label class="mu"><input type="checkbox" ${WR.L?'checked':''} onchange="WR.L=this.checked"> ไม่ตรวจวรรณยุกต์</label><br><button class="on" onclick="wchk()">ตรวจ</button> <button onclick="say('${w.h}')">🔊</button> <button onclick="WR.w=null;wpy()">ข้าม</button><div id="pf"></div></div>`}
function wchk(){const w=WR.w,v=$('#pi').value.trim();if(!v)return;const ok=pyok(v,w.p,WR.L);rec(w,ok,3);
 $('#pf').innerHTML=`<p style="color:var(--${ok?'ok':'ac'})">${ok?'✅ ถูกต้อง':'❌ ไม่ถูก'} — <span class="py">${w.p}</span></p><button class="on" onclick="WR.w=null;wpy()">ข้อต่อไป</button>`}
function wso(){
 if(!WS){const c=pool().filter(w=>w.ex&&w.ex.length>=5);let t=null;for(let n=0;n<40&&c.length;n++){const w=c[Math.floor(Math.random()*c.length)],g=seg(w.ex.replace(/[，。？！、]/g,''));if(g.length>=3&&g.length<=8){t={w,g};break}}
  if(!t){$('#wb').innerHTML='<div class="card">ยังไม่มีประโยคพอในระดับนี้</div>';return}
  const id=t.g.map((_,i)=>i);let ord=id;for(let k=0;k<9;k++){ord=shuf(id);if(ord.join()!==id.join())break}
  WS={w:t.w,g:t.g,ord,sel:[],done:null}}
 const {g,ord,sel,w}=WS;
 $('#wb').innerHTML=`<div class="card"><div class="mu">เรียงคำให้เป็นประโยค · คำสำคัญ: <b>${w.h}</b> ${w.m?'('+cut(w.m,30)+')':''}</div><div class="ex" style="min-height:52px;margin:8px 0;font-size:22px">${sel.map(i=>`<button onclick="WS.done==null&&(WS.sel=WS.sel.filter(x=>x!=${i}),wso())">${g[i]}</button>`).join(' ')||'<span class="mu">แตะคำด้านล่างเพื่อเรียง</span>'}</div><div class="row">${ord.filter(i=>!sel.includes(i)).map(i=>`<button style="font-size:20px" onclick="WS.done==null&&(WS.sel.push(${i}),wso())">${g[i]}</button>`).join('')}</div><br><button class="on" onclick="schk()" ${sel.length<g.length||WS.done!=null?'disabled':''}>ตรวจ</button> <button onclick="WS=null;wso()">ข้อใหม่</button>${WS.done==null?'':`<p style="color:var(--${WS.done?'ok':'ac'})">${WS.done?'✅ ถูกต้อง':'❌ ยังไม่ถูก'}</p><p>เฉลย: <span style="font-size:20px">${g.join('')}</span> <button onclick="say('${g.join('')}')">🔊</button></p><button class="on" onclick="WS=null;wso()">ข้อต่อไป</button>`}</div>`}
function schk(){const ok=WS.sel.map(i=>WS.g[i]).join('')===WS.g.join('');WS.done=ok;rec(WS.w,ok,4);wso()}
/* ---- HSK reading ---- */

[1,"我叫小明，我是中国学生。我家有四口人：爸爸、妈妈、哥哥和我。我爸爸是医生，妈妈是老师。","ฉันชื่อเสี่ยวหมิง เป็นนักเรียนจีน ครอบครัวมี 4 คน คือพ่อ แม่ พี่ชาย และฉัน พ่อเป็นหมอ แม่เป็นครู",[["小明家有几口人？",["三口人","四口人","五口人"],1],["妈妈做什么工作？",["医生","学生","老师"],2]]],

[2,"我每天早上七点起床，八点坐公共汽车去学校。中午我在学校吃饭，下午四点回家。晚上我喜欢看电视。","ฉันตื่น 7 โมงทุกเช้า 8 โมงนั่งรถเมล์ไปโรงเรียน กลางวันกินข้าวที่โรงเรียน 4 โมงเย็นกลับบ้าน ตอนค่ำชอบดูทีวี",[["他怎么去学校？",["坐公共汽车","骑自行车","走路"],0],["他几点回家？",["三点","四点","五点"],1]]],

[3,"周末我和妈妈去超市买东西。超市里的水果很新鲜，我们买了香蕉和西瓜。回家后，妈妈做了一个很好吃的菜。","สุดสัปดาห์ฉันกับแม่ไปซื้อของที่ซูเปอร์ มาร์เก็ต ผลไม้สดมาก เราซื้อกล้วยกับแตงโม กลับบ้านแม่ทำอาหารอร่อยมาก",[["他们周末去哪儿？",["超市","公园","银行"],0],["谁做菜？",["爸爸","妈妈","朋友"],1]]],
[3,"我喜欢旅游。去年我去了北京，那里的长城很有名。我还吃了北京烤鸭，味道非常好。我希望明年再去一次。","ฉันชอบเที่ยว ปีที่แล้วไปปักกิ่ง กำแพงเมืองจีนที่นั่นมีชื่อเสียงมาก ยังได้กินเป็ดปักกิ่งรสชาติดีมาก หวังว่าปีหน้าจะไปอีก",[["去年他去了哪儿？",["上海","北京","广州"],1],["他明年想做什么？",["再去北京","去上海","在家休息"],0]]],

let RM='cz',CZ=null,PS=null;
function vrd(){$('#v').innerHTML=`<div class="row"><button class="${RM=='cz'?'on':''}" onclick="RM='cz';vrd()">เติมคำในประโยค</button><button class="${RM=='ps'?'on':''}" onclick="RM='ps';vrd()">บทอ่านสั้น</button></div><div id="rb"></div>`;RM=='cz'?vcz():vps()}
function vcz(){
 if(!CZ||CZ.w.l>S.lv){const c=pool().filter(w=>w.ex&&w.ex.length>=4&&w.ex.includes(w.h));if(c.length<4){$('#rb').innerHTML='<div class="card">ยังไม่มีข้อมูลพอ</div>';return}
  const w=c[Math.floor(Math.random()*c.length)],bad=z=>z.i==w.i||z.h==w.h||w.ex.includes(z.h);let d=shuf(pool().filter(z=>!bad(z)&&z.c==w.c&&z.h.length==w.h.length));if(d.length<3)d=shuf(pool().filter(z=>!bad(z)));
  CZ={w,o:shuf([w,...d.slice(0,3)]),a:null}}
 const {w,o,a}=CZ;
 $('#rb').innerHTML=`<div class="card"><div class="mu">เลือกคำที่เติมช่องว่าง</div><div style="font-size:24px;margin:8px 0">${w.ex.replace(w.h,'＿＿')}</div>`+o.map((z,j)=>`<button class="opt ${a==null?'':z===w?'ok':j==a?'no':''}" ${a==null?'':'disabled'} onclick="cza(${j})">${z.h}</button>`).join('')+(a==null?'':`<p>${w.ex} <button onclick="say('${w.ex}')">🔊</button><br><span class="py">${w.p}</span> ${w.m||''}</p><button class="on" onclick="CZ=null;vcz()">ข้อต่อไป</button>`)+`</div>`}
function cza(j){CZ.a=j;rec(CZ.w,CZ.o[j]===CZ.w,5);vcz()}
function vps(){

 if(!PS||PS.lv!==S.lv)PS={lv:S.lv,n:Math.floor(Math.random()*L.length),a:{}};
 const p=L[PS.n%L.length],done=p[3].every((_,k)=>PS.a[k]!=null);
 $('#rb').innerHTML=`<div class="card"><div class="mu">HSK ${p[0]} · บทอ่านที่ ${PS.n%L.length+1}/${L.length}</div><div style="font-size:21px;line-height:2">${p[1]} <button onclick="say('${p[1]}')">🔊</button></div></div>`+p[3].map((q,k)=>`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt ${PS.a[k]==null?'':j==q[2]?'ok':j==PS.a[k]?'no':''}" ${PS.a[k]==null?'':'disabled'} onclick="psa(${k},${j})">${o}</button>`).join('')+`</div>`).join('')+(done?`<div class="card">แปล: ${p[2]}<br><br><button class="on" onclick="PS.n++;PS.a={};vps()">บทต่อไป</button></div>`:'')}
function psa(k,j){const L=PA.filter(p=>p[0]<=S.lv),p=L[PS.n%L.length];PS.a[k]=j;const ok=j==p[3][k][2],y=S.ty[6]||[0,0];S.ty[6]=[y[0]+ok,y[1]+1];save();vps()}
